<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reclaim TEE — how a proof is made</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128274;</text></svg>">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header class="hud hud-title">
    <div class="eyebrow">Reclaim Protocol</div>
    <h1>How a TEE proof is made</h1>
    <p class="tagline">Two enclaves each hold half a secret. The plaintext never leaves your device.</p>
  </header>

  <div class="hud hud-theme">
    <button id="voice-toggle" class="muted" aria-label="Toggle narration" title="Narration" hidden>
      <svg class="ic-voice-on" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="ic-voice-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
    </button>
    <button id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <aside class="hud hud-panel" id="panel">
    <div class="panel-head">
      <span class="step-count"><span id="step-num">0</span><span class="step-sep">/</span><span id="step-total">9</span></span>
      <span class="step-eyebrow" id="step-eyebrow">Overview</span>
    </div>
    <h2 id="step-title">The cast</h2>
    <div id="step-body" class="panel-body"></div>
    <div class="panel-wire" id="wire-block">
      <div class="wire-caption">On the wire</div>
      <div class="wire-chips" id="wire-chips"></div>
    </div>
  </aside>

  <nav class="hud hud-controls" aria-label="Tour controls">
    <button id="btn-prev" class="ctl" aria-label="Previous step">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="btn-play" class="ctl ctl-play" aria-label="Play or pause the tour">
      <svg class="ic-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="ic-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <button id="btn-next" class="ctl" aria-label="Next step">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="Tour steps"></div>
  </nav>

  <aside class="hud hud-legend" id="legend">
    <button class="legend-head" id="legend-toggle" aria-expanded="true">What travels the wires</button>
    <ul class="legend-list" id="legend-list"></ul>
    <div class="legend-foot">bright wire — data in flight<br>faint wire — connection open, idle</div>
  </aside>

  <div class="hud hud-hint" id="hint">drag to orbit &middot; scroll to zoom &middot; &larr; &rarr; to step</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
