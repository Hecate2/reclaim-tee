name: Verify TEE Image Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can verify against any commit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify TEE images match image-history.json
        run: ./deploy/verify.sh
